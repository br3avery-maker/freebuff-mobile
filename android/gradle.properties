org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
# AGP 8.5.2 最高正式支持 compileSdk 34; 35 仅为警告, 抑制以保持构建输出干净
android.suppressUnsupportedCompileSdk=35


# 本机系统 JAVA_HOME 是 JDK 8, 而 AGP 8.5 需要 JVM 11+, 所以本机构建请用
#   scripts/gradle.sh <tasks>          ← 它会把 Java 固定到 .toolchain 里的 JDK 17
# 这里**不要**写死 org.gradle.java.home 的绝对路径: 那是机器专属路径,
# 一旦入库会让 GitHub Actions(ubuntu-latest)因找不到该目录而直接构建失败。
