name: Android Release

# 标签触发发版:push 一个 v* 标签 → 跑测试 → 打 release APK → 自动创建 GitHub Release 并附上产物。
#
# 发版步骤(替代手工流程):
#   1. 把 android/version.properties 的 versionCode/versionName 提到新版本并提交推送
#      (版本号唯一来源:app 的 versionName 与 core:model 的 LATEST_VERSION 都由它派生)
#   2. 等 Android CI 全绿
#   3. git tag -a v0.X.Y -m "..." && git push origin v0.X.Y
#
# 工作流会校验「标签 = versionName」,不匹配直接失败 —— 防止发出版本号对不上的包。
# Release 说明自动取上一个标签到本标签之间的提交标题,发完后可在 Releases 页面编辑润色。
# 发版完成后会用 scripts/update-manifest.py 重建 dist/update.json(检查更新的数据源)并回推 main,
# 再自证线上(API + raw)已读到同一版本 —— 回推失败或版本对不上会直接把本次发版判为失败。

on:
  push:
    tags:
      - 'v*'

# 发版一次性完成,不并发取消;同标签重复推送会在创建 Release 时报「已存在」而失败,属预期保护
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 与 android.yml 同款:legacy "tools" 包已被 Google 下架,只需接受许可证
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # v5 = Node 24(与 android.yml 同款;不升 v6 避开专有缓存组件的许可变更)
      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v5

      # 版本号唯一来源 = android/version.properties(app 的 versionName 与 core:model 的 LATEST_VERSION 均由它派生)
      - name: Verify tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # 预发布标签(v0.X.Y-rc1/-beta2)取主版本部分比对,versionName 不携带后缀
          TAG_BASE="${TAG%%-*}"
          VER=$(sed -n 's/^versionName[[:space:]]*=[[:space:]]*//p' version.properties | tr -d ' \r' | head -1)
          echo "tag=$TAG base=$TAG_BASE versionName=$VER"
          if [ -z "$VER" ]; then
            echo "::error::读不到 android/version.properties 的 versionName"
            exit 1
          fi
          if [ "$TAG_BASE" != "$VER" ]; then
            echo "::error::标签 v$TAG 与 versionName $VER 不一致 —— 请先提交 android/version.properties 的版本号提升再打标签"
            exit 1
          fi

      - name: Unit tests (pure JVM + MockWebServer)
        run: ./gradlew :core:model:test :core:data:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 产物按版本重命名(与 docs/build-and-release.md 的 dist 约定一致)
      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FreebuffMobile-${GITHUB_REF_NAME#v}-release.apk"
          ls -la dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          if git rev-parse "$PREV" >/dev/null 2>&1 && [ "$PREV" != "${GITHUB_REF_NAME}" ]; then
            NOTES=$(git log --pretty=format:'- %s (%h)' "$PREV..${GITHUB_REF_NAME}")
          else
            NOTES="- 首个自动发版"
          fi
          {
            echo "自动发布 ${GITHUB_REF_NAME}。"
            echo
            echo "## 变更"
            echo
            echo "$NOTES"
            echo
            echo "---"
            echo
            echo "**安装**:下载 APK(Android 8.0+,允许安装未知来源)。签名证书说明见 docs/build-and-release.md。"
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            "dist/FreebuffMobile-${GITHUB_REF_NAME#v}-release.apk" \
            --title "Freebuff Mobile ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

      # 发版后重建 dist/update.json —— App 内「检查更新」拉取的数据源(UPDATE_URL 默认直链它)。
      # 生成与校验共用 scripts/update-manifest.py(CI 的 --check 与本地/发版同一份规则)。
      # 提交说明以 [skip ci] 结尾避免触发 android.yml。
      # 回推被抢先时重拉重试;三次都推不上去 = 更新通道停在旧版本,直接把本次发版判失败。
      - name: Refresh update.json (in-app update source)
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          VER="${GITHUB_REF_NAME#v}"
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          python3 scripts/update-manifest.py "$VER" --prev "$PREV" --ref "${GITHUB_REF_NAME}"
          python3 scripts/update-manifest.py --check
          if git diff --quiet -- dist/update.json; then
            echo "dist/update.json 无变化,跳过回推"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/update.json
          git commit -m "发版 ${GITHUB_REF_NAME}:刷新检查更新数据源 [skip ci]"
          pushed=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "push 失败,第 $i 次重拉重试…"
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::dist/update.json 回推 main 失败 —— 更新通道会停在 v$PREV。请在 Actions 里重跑本工作流"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 自证更新通道:回推后从 GitHub API 确认线上清单就是本次版本(权威,非 CDN),
      # 再轮询 raw 直链(用户 App 实际请求的地址)记录 CDN 是否已跟上。
      - name: Verify published update source
        if: steps.manifest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          VER="${GITHUB_REF_NAME#v}"
          GOT=""
          for i in $(seq 1 6); do
            GOT=$(gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/dist/update.json" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            echo "第 $i 次(API):线上 update.json version='$GOT'"
            [ "$GOT" = "$VER" ] && break
            sleep 10
          done
          if [ "$GOT" != "$VER" ]; then
            echo "::error::线上 dist/update.json 不是 v$VER(读到 '$GOT')—— 检查回推是否真的落到 main"
            exit 1
          fi
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/dist/update.json"
          for i in $(seq 1 10); do
            GOT_RAW=$(curl -fsS --max-time 10 "$RAW?cb=$RANDOM" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            echo "第 $i 次(raw/CDN):'$GOT_RAW'"
            [ "$GOT_RAW" = "$VER" ] && { echo "更新源已可匿名读取且版本一致:v$VER"; exit 0; }
            sleep 15
          done
          echo "::warning::raw 仍是 CDN 缓存中的旧版本(不影响发布,App 稍后拉取即可拿到 v$VER)"
