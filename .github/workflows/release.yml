name: Android Release

# 标签触发发版:push 一个 v* 标签 → 跑测试 → 打 release APK → 自动创建 GitHub Release 并附上产物。
#
# 发版步骤(替代手工流程):
#   1. 把 android/version.properties 的 versionCode/versionName 提到新版本并提交推送
#      (版本号唯一来源:app 的 versionName 与 core:model 的 LATEST_VERSION 都由它派生)
#   2. 等 Android CI 全绿
#   3. git tag -a v0.X.Y -m "..." && git push origin v0.X.Y
#
# 工作流会校验「标签 = versionName」,不匹配直接失败 —— 防止发出版本号对不上的包。
# Release 说明自动取上一个标签到本标签之间的提交标题,发完后可在 Releases 页面编辑润色。
# 发版完成后会用 scripts/update-manifest.py 重建 dist/update.json(检查更新的数据源)并回推 main,
# 再自证线上(API + raw)已读到同一版本 —— 回推失败或版本对不上会直接把本次发版判为失败。
#
# 干跑(Actions 页面手动触发,workflow_dispatch):跑同一套步骤,但**不发 Release**,
# 重建的 dist/update.json 也只回推到临时分支,main 与更新通道完全不动 ——
# 用来在打正式标签之前验证「标签 → 版本号 → 清单 → 回推 → 线上自证」整条链。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '模拟的发版标签(如 v1.0.0);留空 = 用 android/version.properties 的 versionName 拼 v<版本>'
        type: string
        default: ''
      dry_run:
        description: '干跑:不发 Release,清单只回推到临时分支'
        type: boolean
        default: true
      manifest_branch:
        description: '干跑时清单回推的分支'
        type: string
        default: 'dryrun/update-manifest'

# 发版一次性完成,不并发取消;同标签重复推送会在创建 Release 时报「已存在」而失败,属预期保护
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 必须完整历史 + 标签:更新说明 = 上一个标签到本次版本之间的提交标题,
          # 浅克隆会让 git describe 找不到上一个标签,说明退化成空/无关内容(干跑时实测过)。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 与 android.yml 同款:legacy "tools" 包已被 Google 下架,只需接受许可证
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # v5 = Node 24(与 android.yml 同款;不升 v6 避开专有缓存组件的许可变更)
      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v5

      # 归一化本次运行的四个量,后续步骤一律读这里 —— 手动触发时 GITHUB_REF_NAME 是分支名而非标签,
      # 直接读它会把 main 当成版本号。标签推送永远是正式模式,不受输入影响。
      - name: Resolve release ref
        id: rel
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$IN_TAG"
            if [ -z "$TAG" ]; then
              PROP_VER=$(sed -n 's/^versionName[[:space:]]*=[[:space:]]*//p' android/version.properties | tr -d ' \r' | head -1)
              TAG="v$PROP_VER"
            fi
            REF="$TAG"
            # 干跑时这个标签通常还不存在 —— 仅把「用于 git 操作的引用」退到当前提交,
            # 版本号仍取输入标签(退到 sha 会让清单版本变成一串哈希)。
            git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1 || REF="$(git rev-parse HEAD)"
            DRY="${IN_DRY:-true}"
            BRANCH="${IN_BRANCH:-dryrun/update-manifest}"
          else
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF_NAME}"
            DRY="false"
            BRANCH="main"
          fi
          # 预发布标签(v1.2.0-rc1)保留完整标签做包名/标题,清单版本取主版本部分(version.properties 不带后缀)
          LABEL="${TAG#v}"
          BASE="${LABEL%%-*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version_label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "version_base=$BASE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "manifest_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT tag=$TAG ref=$REF label=$LABEL base=$BASE dry_run=$DRY manifest_branch=$BRANCH"

      # 版本号唯一来源 = android/version.properties(app 的 versionName 与 core:model 的 LATEST_VERSION 均由它派生)
      - name: Verify tag matches versionName
        env:
          REF: ${{ steps.rel.outputs.ref }}
          TAG_BASE: ${{ steps.rel.outputs.version_base }}
        run: |
          VER=$(sed -n 's/^versionName[[:space:]]*=[[:space:]]*//p' version.properties | tr -d ' \r' | head -1)
          echo "ref=$REF base=$TAG_BASE versionName=$VER"
          if [ -z "$VER" ]; then
            echo "::error::读不到 android/version.properties 的 versionName"
            exit 1
          fi
          if [ "$TAG_BASE" != "$VER" ]; then
            echo "::error::标签版本 $TAG_BASE 与 versionName $VER 不一致 —— 请先提交 android/version.properties 的版本号提升再打标签"
            exit 1
          fi

      - name: Unit tests (pure JVM + MockWebServer)
        run: ./gradlew :core:model:test :core:data:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 产物按版本重命名(与 docs/build-and-release.md 的 dist 约定一致)
      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FreebuffMobile-${{ steps.rel.outputs.version_label }}-release.apk"
          ls -la dist

      # 自证包本身:签名证书是谁、APK 里的 versionName/versionCode 是否等于版本号唯一来源。
      # 未注入 keystore.properties(CI 上即 Secrets 未配置)时会走 debug 签名回退 ——
      # 这一步让它显式可见并写进 Release 说明,而不是等用户装上才发现是 debug 证书。
      - name: Inspect APK (signature + version)
        id: apk
        env:
          VERSION_LABEL: ${{ steps.rel.outputs.version_label }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          # 精确取本次版本的产物:ls|head 会挑到目录里残留的旧包(本地干跑时实测踩到)
          APK="android/dist/FreebuffMobile-${VERSION_LABEL}-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::找不到本次版本的产物 $APK"
            exit 1
          fi
          echo "APK=$APK ($(du -h "$APK" | cut -f1))"
          BUILD_TOOLS=""
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          fi
          # CI(Linux)上是 apksigner/aapt2,本地 Git Bash(Windows)上是 .bat/.exe —— 两种都找
          find_tool() {
            for cand in "$BUILD_TOOLS/$1" "$BUILD_TOOLS/$1.exe" "$BUILD_TOOLS/$1.bat"; do
              [ -f "$cand" ] && { echo "$cand"; return 0; }
            done
            return 1
          }
          SIGNED="unknown"
          APKSIGNER="$(find_tool apksigner || true)"
          AAPT2="$(find_tool aapt2 || true)"
          if [ -n "$APKSIGNER" ]; then
            if ! OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
              echo "$OUT"
              echo "::error::APK 签名校验失败"
              exit 1
            fi
            echo "$OUT"
            if echo "$OUT" | grep -qi "Android Debug"; then
              SIGNED="debug"
              echo "::warning::本次产物用的是 debug 证书(未注入 keystore.properties / Secrets)—— 可安装体验,但不可上架;日后换正式签名需先卸载旧包"
            else
              SIGNED="release"
              echo "签名 = 正式证书"
            fi
          else
            echo "::warning::$BUILD_TOOLS 里找不到 apksigner,跳过签名校验"
          fi
          EXPECT_NAME="$VERSION_LABEL"
          EXPECT_CODE=$(sed -n 's/^versionCode[[:space:]]*=[[:space:]]*//p' android/version.properties | tr -d ' \r' | head -1)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK" 2>/dev/null | head -2)
            echo "$BADGING"
            GOT_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
            GOT_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
            if [ -z "$GOT_NAME" ] || [ -z "$GOT_CODE" ]; then
              echo "::error::读不出 APK 的 versionName/versionCode(产物缺失版本信息)"
              exit 1
            fi
            if [ "$GOT_NAME" != "$EXPECT_NAME" ] || [ "$GOT_CODE" != "$EXPECT_CODE" ]; then
              echo "::error::APK 版本与 version.properties 不一致:包内 $GOT_NAME($GOT_CODE) ≠ 期望 $EXPECT_NAME($EXPECT_CODE)"
              exit 1
            fi
            echo "版本自证 PASS:versionName=$GOT_NAME versionCode=$GOT_CODE 与 version.properties 一致"
          else
            echo "::warning::$BUILD_TOOLS 里找不到 aapt2,跳过包内版本校验"
          fi
          {
            echo "signed=$SIGNED"
            echo "path=$APK"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # 干跑不发 Release(发布不可撤销),其余步骤与正式发版完全一致
        if: steps.rel.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.rel.outputs.ref }}
          SIGNED: ${{ steps.apk.outputs.signed }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || true)
          if [ -n "$PREV" ] && [ "$PREV" != "$REF" ]; then
            NOTES=$(git log --pretty=format:'- %s (%h)' "$PREV..$REF")
          else
            NOTES=""
          fi
          [ -n "$NOTES" ] || NOTES="- 首个自动发版"
          if [ "$SIGNED" = "debug" ]; then
            SIGN_NOTE="> ⚠️ 本包为 **debug 证书**签名(未注入发版密钥),可安装体验,不可上架;日后换成正式签名需先卸载旧版。"
          else
            SIGN_NOTE=""
          fi
          {
            echo "自动发布 ${REF}。"
            echo
            echo "## 变更"
            echo
            echo "$NOTES"
            echo
            echo "$SIGN_NOTE"
            echo "---"
            echo
            echo "**安装**:下载 APK(Android 8.0+,允许安装未知来源)。签名证书说明见 docs/build-and-release.md。"
          } > release-notes.md
          gh release create "${REF}" \
            "dist/FreebuffMobile-${{ steps.rel.outputs.version_label }}-release.apk" \
            --title "Freebuff Mobile ${REF}" \
            --notes-file release-notes.md

      # 发版后重建 dist/update.json —— App 内「检查更新」拉取的数据源(UPDATE_URL 默认直链它)。
      # 生成与校验共用 scripts/update-manifest.py(CI 的 --check 与本地/发版同一份规则)。
      # 正式发版推到 main;干跑只推临时分支(默认 dryrun/update-manifest),更新通道不受影响。
      # 提交说明以 [skip ci] 结尾避免触发 android.yml。
      # 回推被抢先时重拉重试;三次都推不上去 = 更新通道停在旧版本,直接把本次发版判失败。
      - name: Refresh update.json (in-app update source)
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.rel.outputs.ref }}
          VERSION_BASE: ${{ steps.rel.outputs.version_base }}
          DEST: ${{ steps.rel.outputs.manifest_branch }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          PREV=$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || true)
          python3 scripts/update-manifest.py "$VERSION_BASE" --prev "$PREV" --ref "$REF"
          python3 scripts/update-manifest.py --check
          if git diff --quiet -- dist/update.json; then
            echo "dist/update.json 无变化,跳过回推"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/update.json
          git commit -m "发版 ${REF}:刷新检查更新数据源 [skip ci]"
          pushed=0
          for i in 1 2 3; do
            # 目标必须写成 refs/heads/<分支>:带斜杠的临时分支(如 dryrun/update-manifest)
            # 写成 HEAD:dryrun/update-manifest 时 git 无法判定是分支还是标签,直接拒绝推送。
            if git push origin "HEAD:refs/heads/${DEST}"; then pushed=1; break; fi
            echo "push 失败,第 $i 次重拉重试…"
            git fetch origin "$DEST"
            git rebase "origin/$DEST" || git rebase --abort
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::dist/update.json 回推 ${DEST} 失败 —— 请在 Actions 里重跑本工作流"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 自证更新通道:回推后从 GitHub API 确认线上清单就是本次版本(权威,非 CDN),
      # 再轮询 raw 直链(用户 App 实际请求的地址)记录 CDN 是否已跟上。
      # 干跑额外断言 main 上的清单没被动过 —— 干跑绝不允许影响真正的更新通道。
      - name: Verify published update source
        if: steps.manifest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.rel.outputs.version_base }}
          DEST: ${{ steps.rel.outputs.manifest_branch }}
          DRY: ${{ steps.rel.outputs.dry_run }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          GOT=""
          for i in $(seq 1 6); do
            GOT=$(gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/dist/update.json?ref=${DEST}" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            echo "第 $i 次(API ${DEST}):线上 update.json version='$GOT'"
            [ "$GOT" = "$VER" ] && break
            sleep 10
          done
          if [ "$GOT" != "$VER" ]; then
            echo "::error::${DEST} 上的 dist/update.json 不是 v$VER(读到 '$GOT')—— 检查回推是否真的落盘"
            exit 1
          fi
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DEST}/dist/update.json"
          for i in $(seq 1 10); do
            GOT_RAW=$(curl -fsS --max-time 10 "$RAW?cb=$RANDOM" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            echo "第 $i 次(raw/${DEST}):'$GOT_RAW'"
            [ "$GOT_RAW" = "$VER" ] && { echo "更新源已可匿名读取且版本一致:v$VER"; break; }
            sleep 15
          done
          if [ "$GOT_RAW" != "$VER" ]; then
            echo "::warning::raw 仍是 CDN 缓存中的旧版本(不影响发布,App 稍后拉取即可拿到 v$VER)"
          fi
          if [ "$DRY" = "true" ]; then
            MAIN_VER=$(gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/dist/update.json?ref=main" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            if [ "$MAIN_VER" = "$VER" ]; then
              echo "::error::干跑把 main 上的清单也写成了 v$VER —— 干跑不允许改动真正的更新通道"
              exit 1
            fi
            echo "干跑自证 PASS:清单已在 ${DEST} 读到 v$VER,main 仍是 v$MAIN_VER(未受影响)"
          fi
