name: Android Release

# 标签触发发版:push 一个 v* 标签 → 跑测试 → 打 release APK → 自动创建 GitHub Release 并附上产物。
#
# 发版步骤(替代手工流程):
#   1. 把 android/app/build.gradle.kts 的 versionCode/versionName 与 LATEST_VERSION 提到新版本并提交推送
#   2. 等 Android CI 全绿
#   3. git tag -a v0.X.Y -m "..." && git push origin v0.X.Y
#
# 工作流会校验「标签 = versionName」,不匹配直接失败 —— 防止发出版本号对不上的包。
# Release 说明自动取上一个标签到本标签之间的提交标题,发完后可在 Releases 页面编辑润色。

on:
  push:
    tags:
      - 'v*'

# 发版一次性完成,不并发取消;同标签重复推送会在创建 Release 时报「已存在」而失败,属预期保护
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 与 android.yml 同款:legacy "tools" 包已被 Google 下架,只需接受许可证
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG versionName=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::标签 v$TAG 与 versionName $VER 不一致 —— 请先提交版本号提升再打标签"
            exit 1
          fi

      - name: Unit tests (pure JVM + MockWebServer)
        run: ./gradlew :core:model:test :core:data:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 产物按版本重命名(与 docs/build-and-release.md 的 dist 约定一致)
      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FreebuffMobile-${GITHUB_REF_NAME#v}-release.apk"
          ls -la dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          if git rev-parse "$PREV" >/dev/null 2>&1 && [ "$PREV" != "${GITHUB_REF_NAME}" ]; then
            NOTES=$(git log --pretty=format:'- %s (%h)' "$PREV..${GITHUB_REF_NAME}")
          else
            NOTES="- 首个自动发版"
          fi
          {
            echo "自动发布 ${GITHUB_REF_NAME}。"
            echo
            echo "## 变更"
            echo
            echo "$NOTES"
            echo
            echo "---"
            echo
            echo "**安装**:下载 APK(Android 8.0+,允许安装未知来源)。签名证书说明见 docs/build-and-release.md。"
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            "dist/FreebuffMobile-${GITHUB_REF_NAME#v}-release.apk" \
            --title "Freebuff Mobile ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
