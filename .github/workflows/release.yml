name: Android Release

# 标签触发发版:push 一个 v* 标签 → 跑测试 → 打 release APK → 自动创建 GitHub Release 并附上产物。
#
# 发版步骤(替代手工流程):
#   1. 把 android/app/build.gradle.kts 的 versionCode/versionName 与 LATEST_VERSION 提到新版本并提交推送
#   2. 等 Android CI 全绿
#   3. git tag -a v0.X.Y -m "..." && git push origin v0.X.Y
#
# 工作流会校验「标签 = versionName」,不匹配直接失败 —— 防止发出版本号对不上的包。
# Release 说明自动取上一个标签到本标签之间的提交标题,发完后可在 Releases 页面编辑润色。
# 发版完成后会自动刷新 dist/update.json(检查更新的数据源)并回推 main。

on:
  push:
    tags:
      - 'v*'

# 发版一次性完成,不并发取消;同标签重复推送会在创建 Release 时报「已存在」而失败,属预期保护
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 与 android.yml 同款:legacy "tools" 包已被 Google 下架,只需接受许可证
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # v5 = Node 24(与 android.yml 同款;不升 v6 避开专有缓存组件的许可变更)
      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Verify tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # 预发布标签(v0.X.Y-rc1/-beta2)取主版本部分比对,versionName 不携带后缀
          TAG_BASE="${TAG%%-*}"
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG base=$TAG_BASE versionName=$VER"
          if [ "$TAG_BASE" != "$VER" ]; then
            echo "::error::标签 v$TAG 与 versionName $VER 不一致 —— 请先提交版本号提升再打标签"
            exit 1
          fi

      - name: Unit tests (pure JVM + MockWebServer)
        run: ./gradlew :core:model:test :core:data:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 产物按版本重命名(与 docs/build-and-release.md 的 dist 约定一致)
      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FreebuffMobile-${GITHUB_REF_NAME#v}-release.apk"
          ls -la dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          if git rev-parse "$PREV" >/dev/null 2>&1 && [ "$PREV" != "${GITHUB_REF_NAME}" ]; then
            NOTES=$(git log --pretty=format:'- %s (%h)' "$PREV..${GITHUB_REF_NAME}")
          else
            NOTES="- 首个自动发版"
          fi
          {
            echo "自动发布 ${GITHUB_REF_NAME}。"
            echo
            echo "## 变更"
            echo
            echo "$NOTES"
            echo
            echo "---"
            echo
            echo "**安装**:下载 APK(Android 8.0+,允许安装未知来源)。签名证书说明见 docs/build-and-release.md。"
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            "dist/FreebuffMobile-${GITHUB_REF_NAME#v}-release.apk" \
            --title "Freebuff Mobile ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

      # 发版后刷新 dist/update.json —— 这是 App 内「检查更新」拉取的数据源(UPDATE_URL 直链它)。
      # 用 python 生成 JSON 免去 shell 转义地狱;提交说明以 [skip ci] 结尾避免触发 android.yml。
      # 冲突容忍:回推被抢先时重拉一次再改;偶尔仍失败不影响 Release 本身(已发布),下次发版会覆盖。
      - name: Refresh update.json (in-app update source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          VER="${GITHUB_REF_NAME#v}"
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          python3 - "$VER" "$PREV" <<'PYEOF'
          import json, subprocess, sys

          ver, prev = sys.argv[1], sys.argv[2] if len(sys.argv) > 2 else ""
          notes = []
          if prev:
              out = subprocess.run(
                  ["git", "log", "--pretty=format:%s", f"{prev}..{ver}"],
                  capture_output=True, text=True,
              ).stdout
              notes = [ln.strip() for ln in out.splitlines() if ln.strip()]
          payload = {"version": ver, "url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'doubao01/freebuff-mobile')}/releases/latest", "notes": notes or ["自动发版"]}

          import os
          path = "dist/update.json"
          os.makedirs("dist", exist_ok=True)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"dist/update.json -> {ver}, {len(payload['notes'])} notes")
          PYEOF
          if ! git diff --quiet -- dist/update.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/update.json
            git commit -m "发版 ${GITHUB_REF_NAME}:刷新检查更新数据源 [skip ci]"
            for i in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              echo "push 失败,第 $i 次重拉重试…"
              git fetch origin main
              git rebase origin/main || git rebase --abort
            done
          else
            echo "dist/update.json 无变化,跳过回推"
          fi
