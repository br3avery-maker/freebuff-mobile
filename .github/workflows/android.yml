name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      # --stacktrace:失败时直接给出仓库/依赖级别的真实原因, 不用再补一次只能看个结论的构建
      - name: Unit tests (pure JVM + MockWebServer)
        run: ./gradlew :core:model:test :core:data:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
