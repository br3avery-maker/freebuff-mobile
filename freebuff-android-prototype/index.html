<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0c0c0f"/>
<title>Freebuff Mobile · 概念原型</title>
<link rel="stylesheet" href="css/app.css"/>
<link rel="icon" type="image/png" href="assets/logo-icon.png"/>
</head>
<body>
  <!-- 桌面端的说明浮层(手机宽度下自动隐藏) -->
  <aside class="side-note" aria-hidden="false">
    <p><strong>Freebuff Mobile</strong> · 官方安卓 App 概念原型</p>
    <ul>
      <li>在 <b>393px 手机视口</b> 内交互:点底部「+」走 <em>仓库 → 模型 → 任务</em> 三步流程发起任务,在对话页体验<em>模拟流式回复</em></li>
      <li>界面文案为中文(演示用),文案集中于 <code>js/app.js</code> 的 <code>STR</code> 数据层,便于后续本地化</li>
      <li>所有对话均为预置演示内容,<b>不连接真实模型</b></li>
    </ul>
    <p class="dim">可切换 深色/浅色 主题(右上角/设置页);底部为原型交互提示。</p>
  </aside>

  <div class="device-wrap">
    <div class="device" id="app" role="application" aria-label="Freebuff Mobile 原型">
      <!-- 状态栏 -->
      <div class="statusbar">
        <span class="statusbar-time" id="sbTime">9:41</span>
        <span class="statusbar-icons" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M2 16.5h2.2l.2-2.1A3 3 0 0 1 7.4 12h.1a3 3 0 0 1 3 2.4l.2 2.1H13"/><rect x="14" y="12.5" width="1.8" height="3.5" rx=".6"/><rect x="17" y="10.5" width="1.8" height="5.5" rx=".6"/><rect x="20" y="8" width="1.8" height="8" rx=".6"/></svg>
          <svg viewBox="0 0 24 24"><rect x="3" y="10" width="15" height="6" rx="1.6" fill="none" stroke="currentColor"/><path d="M8 10V7.8A2.8 2.8 0 0 1 13.6 7V10"/></svg>
        </span>
      </div>

      <!-- 屏幕容器:每个 screen 是一屏,JS 切换 -->
      <main class="screens" id="screens"></main>

      <!-- 底部导航(欢迎页隐藏) -->
      <nav class="tabbar hidden" id="tabbar">
        <button class="tab" data-tab="home">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M13 3h4.5A2.5 2.5 0 0 1 20 5.5V11h-7z"/><path d="M13 13h7v5.5a2.5 2.5 0 0 1-2.5 2.5H13z"/></svg>
          <span data-i18n="tab.sessions">会话</span>
        </button>
        <button class="fab" data-action="new-chat" aria-label="新建对话">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="tab" data-tab="settings">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1 1.55.57.26 1.27.15 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08c.26.61.88 1 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
          <span data-i18n="tab.settings">设置</span>
        </button>
      </nav>

      <!-- 底部弹层容器(模型选择 / 更多操作 / 提示条) -->
      <div class="overlay-root" id="overlayRoot"></div>
      <div class="snackbar" id="snackbar" role="status"></div>
    </div>
  </div>

<script src="js/app.js"></script>
</body>
</html>
